<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSA 10 FIESTA · Pokémon TCG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg0:#06060D;--bg1:#0C0C18;--bg2:#121220;--bg3:#1A1A2E;
  --orange:#F97316;--orange-l:#FB923C;
  --amber:#F59E0B;--gold:#EAB308;
  --t1:#FFFFFF;--t2:#CBD5E1;--t3:#64748B;
  --border:rgba(255,255,255,0.08);--border-h:rgba(255,255,255,0.16);
  --r:12px;--rl:16px;--rxl:24px
}
body{font-family:'Nunito',sans-serif;background:var(--bg0);color:var(--t1);min-height:100vh;overflow-x:hidden}

/* BANNER */
.banner{position:relative;overflow:hidden}
.banner-bg{position:absolute;inset:0;background:radial-gradient(ellipse 90% 60% at 50% -5%,rgba(249,115,22,.38) 0%,transparent 60%),radial-gradient(ellipse 40% 40% at 15% 90%,rgba(168,85,247,.18) 0%,transparent 50%),linear-gradient(180deg,#1A0800 0%,#06060D 100%);z-index:0}
.particles{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.particle{position:absolute;bottom:-10px;border-radius:50%;animation:float-up linear infinite;opacity:0}
@keyframes float-up{0%{transform:translateY(0) scale(1);opacity:.8}100%{transform:translateY(-260px) scale(0);opacity:0}}
.banner-content{position:relative;z-index:1;max-width:940px;margin:0 auto;padding:48px 20px 36px;display:flex;flex-direction:column;align-items:center;text-align:center}
.banner-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(249,115,22,.12);border:1px solid rgba(249,115,22,.4);color:var(--orange-l);font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:5px 14px;border-radius:100px;margin-bottom:18px}
.banner-title{font-family:'Bebas Neue',sans-serif;font-size:clamp(40px,9vw,82px);line-height:.95;letter-spacing:.03em;background:linear-gradient(140deg,#FF9A3C 0%,#FFD700 45%,#FF6B35 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:14px}
.banner-sub{font-size:15px;color:var(--t2);font-weight:600;margin-bottom:28px}
.banner-stats{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.stat-pill{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.06);border:1px solid var(--border);padding:9px 18px;border-radius:100px;font-size:13px;font-weight:700}
.stat-pill .lbl{color:var(--t3);font-size:11px;font-weight:600}
.stat-pill .val{color:var(--orange-l)}

/* MAIN */
.main{max-width:940px;margin:0 auto;padding:28px 16px 120px}
.section-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.section-title{font-family:'Bebas Neue',sans-serif;font-size:21px;letter-spacing:.05em;color:var(--t2)}

/* PRIZE GRID */
.prize-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(138px,1fr));gap:12px;margin-bottom:28px}
.pcard{position:relative;background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:14px 10px;cursor:default;transition:all .25s ease;overflow:hidden;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.pcard:hover:not(.sold-out){border-color:var(--border-h);transform:translateY(-4px)}
.pcard.rainbow{border-color:rgba(168,85,247,.5)}.pcard.rainbow:hover{border-color:rgba(168,85,247,.9);box-shadow:0 0 28px rgba(168,85,247,.22)}
.pcard.gold{border-color:rgba(234,179,8,.5)}.pcard.gold:hover{border-color:rgba(234,179,8,.9);box-shadow:0 0 28px rgba(234,179,8,.22)}
.pcard.purple{border-color:rgba(168,85,247,.3)}.pcard.blue{border-color:rgba(59,130,246,.3)}
.pcard.rainbow::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(168,85,247,.1),rgba(59,130,246,.05),rgba(249,115,22,.1));z-index:0}
.pcard.gold::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(234,179,8,.12),rgba(249,115,22,.06));z-index:0}
.card-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:8px;width:100%}
.card-art{width:84px;height:116px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:44px;position:relative;overflow:hidden;flex-shrink:0}
.card-art img{width:100%;height:100%;object-fit:cover}
.rainbow-a{background:linear-gradient(135deg,#1a0030,#0d1a40,#0d3020);box-shadow:0 0 0 2px rgba(168,85,247,.7),inset 0 0 20px rgba(168,85,247,.2)}
.gold-a{background:linear-gradient(135deg,#1a1200,#2a1a00);box-shadow:0 0 0 2px rgba(234,179,8,.7),inset 0 0 20px rgba(234,179,8,.1)}
.purple-a{background:linear-gradient(135deg,#16062a,#0d1030);box-shadow:0 0 0 1.5px rgba(168,85,247,.5)}
.blue-a{background:linear-gradient(135deg,#06122a,#020e24);box-shadow:0 0 0 1.5px rgba(59,130,246,.5)}
.green-a{background:linear-gradient(135deg,#041a10,#061408);box-shadow:0 0 0 1.5px rgba(34,197,94,.5)}
.gray-a{background:var(--bg3);box-shadow:0 0 0 1px rgba(255,255,255,.08)}
.tier-badge{position:absolute;top:-1px;right:-1px;font-size:9px;font-weight:900;letter-spacing:.05em;padding:3px 7px;border-radius:0 8px 0 8px;text-transform:uppercase;pointer-events:none}
.prize-name{font-size:11px;font-weight:700;color:var(--t2);line-height:1.35}
.prize-odds{font-size:10px;color:var(--t3);font-weight:600}
.prize-stock{font-size:10px;font-weight:700}
.st-low{color:#EF4444}.st-mid{color:var(--amber)}.st-ok{color:#22C55E}
.sold-out{opacity:.35;pointer-events:none}
.sold-out-badge{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.55);border-radius:var(--rl);font-size:11px;font-weight:900;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;z-index:3}

/* PULL SECTION */
.pull-section{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rxl);padding:24px;margin-bottom:24px}

.pull-buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pull-btn{position:relative;border:none;border-radius:var(--rl);padding:18px 12px;cursor:pointer;font-family:'Nunito',sans-serif;font-weight:900;transition:all .2s;overflow:hidden;display:flex;flex-direction:column;align-items:center;gap:4px}
.pull-btn:active:not(:disabled){transform:scale(.97)}.pull-btn:disabled{opacity:.45;cursor:not-allowed}
.btn-single{background:linear-gradient(135deg,#7C2D12,#C2410C,#EA580C);color:#fff}
.btn-single:hover:not(:disabled){box-shadow:0 0 32px rgba(249,115,22,.45)}
.btn-ten{background:linear-gradient(135deg,#4C1D95,#6D28D9,#7C3AED);color:#fff}
.btn-ten:hover:not(:disabled){box-shadow:0 0 32px rgba(124,58,237,.45)}
.pull-lbl{font-size:13px;letter-spacing:.02em;opacity:.9}.pull-price{font-size:22px;font-weight:900}
.pull-savings{position:absolute;top:9px;right:9px;background:rgba(255,255,255,.2);font-size:9px;font-weight:900;padding:2px 7px;border-radius:100px;letter-spacing:.05em}
.total-rem{display:flex;align-items:center;justify-content:center;gap:6px;margin-top:16px;font-size:13px;color:var(--t3);font-weight:600}
.total-rem strong{color:var(--t2)}
.stock-bar{width:100%;height:5px;background:rgba(255,255,255,.07);border-radius:100px;margin-top:10px;overflow:hidden}
.stock-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));border-radius:100px;transition:width .5s ease}

/* ODDS */
.odds-section{margin-bottom:24px}
.odds-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:14px 18px;cursor:pointer;font-family:'Nunito',sans-serif;color:var(--t2);font-size:14px;font-weight:700;transition:all .2s}
.odds-toggle:hover{border-color:var(--border-h)}
.odds-chev{transition:transform .3s ease}.odds-chev.open{transform:rotate(180deg)}
.odds-wrap{display:none;background:var(--bg2);border:1px solid var(--border);border-top:none;border-radius:0 0 var(--r) var(--r);overflow:hidden}
.odds-wrap.open{display:block}
.odds-table{width:100%;border-collapse:collapse;font-size:13px}
.odds-table th{background:rgba(255,255,255,.04);padding:10px 14px;text-align:left;font-weight:700;color:var(--t3);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.odds-table td{padding:10px 14px;border-top:1px solid var(--border);color:var(--t2);font-weight:600}
.odds-table tr:hover td{background:rgba(255,255,255,.02)}

/* PULL HISTORY */
.history-list{display:flex;flex-direction:column;gap:8px}
.history-empty{background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:32px;text-align:center;color:var(--t3);font-size:14px;font-weight:600}
.history-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;animation:slidein .35s ease}
@keyframes slidein{from{transform:translateY(-8px);opacity:0}to{transform:translateY(0);opacity:1}}
.h-thumb{width:42px;height:58px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;flex-shrink:0;overflow:hidden}
.h-thumb img{width:100%;height:100%;object-fit:cover}
.h-info{flex:1;min-width:0}
.h-name{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.h-tier{display:inline-block;font-size:10px;font-weight:900;padding:2px 8px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.h-pullnum{font-size:10px;color:var(--t3);font-weight:600;margin-top:2px}
.h-time{font-size:11px;color:var(--t3);font-weight:600;flex-shrink:0;text-align:right}
.clear-history-btn{background:none;border:none;color:var(--t3);font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;cursor:pointer;padding:4px 10px;border-radius:100px;transition:all .2s}
.clear-history-btn:hover{color:#EF4444;background:rgba(239,68,68,.1)}

/* MODAL */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px;z-index:100;opacity:0;pointer-events:none;transition:opacity .3s;overflow-y:auto}
.modal-ov.active{opacity:1;pointer-events:all}
.reveal-title{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:.05em;color:var(--t2);margin-bottom:16px;text-align:center}
.reveal-all-btn{background:none;border:1px solid var(--border-h);color:var(--t2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:8px 22px;border-radius:100px;cursor:pointer;margin-bottom:24px;transition:all .2s}
.reveal-all-btn:hover{background:rgba(255,255,255,.06)}
.cards-grid{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-bottom:28px}
.rcard{width:110px;height:154px;perspective:700px;cursor:pointer}
.rcard-inner{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform .65s cubic-bezier(.4,0,.2,1)}
.rcard-inner.flipped{transform:rotateY(180deg)}
.cface{position:absolute;inset:0;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.cback{background:linear-gradient(135deg,#1A0A00,#2D1A00);border:2px solid rgba(249,115,22,.4);gap:4px}
.cback-emoji{font-size:36px}.cback-logo{font-family:'Bebas Neue',sans-serif;color:rgba(249,115,22,.35);font-size:10px;letter-spacing:.1em}
.cfront{transform:rotateY(180deg);padding:8px;gap:5px;text-align:center}
.cfront-img{width:70px;height:90px;border-radius:6px;object-fit:cover}
.cfront-emoji{font-size:40px;line-height:1}
.cfront-name{font-size:9px;font-weight:700;color:#fff;line-height:1.3}
.cfront-tier{font-size:9px;font-weight:900;padding:2px 7px;border-radius:100px;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.modal-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.modal-btn{font-family:'Nunito',sans-serif;font-weight:700;font-size:14px;padding:13px 30px;border-radius:100px;cursor:pointer;transition:all .2s;border:none}
.modal-btn:hover{opacity:.9;transform:scale(1.03)}
.mbtn-keep{background:var(--orange);color:#fff}

/* CMS FAB */
.cms-fab{position:fixed;bottom:28px;right:24px;z-index:90;background:linear-gradient(135deg,#1A1A2E,#2D2D4E);border:1px solid var(--border-h);color:var(--t2);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:11px 20px;border-radius:100px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.cms-fab:hover{border-color:var(--orange-l);color:var(--orange-l);box-shadow:0 4px 32px rgba(249,115,22,.2)}

/* CMS OVERLAY */
.cms-ov{position:fixed;inset:0;z-index:200;display:flex;opacity:0;pointer-events:none;transition:opacity .3s}
.cms-ov.active{opacity:1;pointer-events:all}
.cms-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.65);cursor:pointer}
.cms-panel{position:relative;margin-left:auto;width:100%;max-width:680px;background:#0E0E1A;border-left:1px solid var(--border);display:flex;flex-direction:column;height:100%;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1)}
.cms-ov.active .cms-panel{transform:translateX(0)}
.cms-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);flex-shrink:0}
.cms-title{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:.05em;color:var(--t1)}
.cms-close{background:none;border:1px solid var(--border);color:var(--t3);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:7px 16px;border-radius:100px;cursor:pointer;transition:all .2s}
.cms-close:hover{border-color:var(--border-h);color:var(--t2)}
.cms-tabs{display:flex;border-bottom:1px solid var(--border);flex-shrink:0}
.cms-tab{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--t3);font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:13px;cursor:pointer;transition:all .2s;margin-bottom:-1px}
.cms-tab.active{color:var(--orange-l);border-bottom-color:var(--orange-l)}
.cms-tab:hover:not(.active){color:var(--t2)}
.cms-body{flex:1;overflow-y:auto;padding:20px 24px}
.cms-body::-webkit-scrollbar{width:4px}.cms-body::-webkit-scrollbar-thumb{background:var(--border-h);border-radius:4px}

/* CMS PRIZE CARD */
.cms-prize-card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:16px;margin-bottom:12px;display:flex;gap:14px;align-items:flex-start}
.cms-thumb-wrap{width:68px;height:94px;border-radius:8px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;position:relative;overflow:hidden;border:2px dashed var(--border-h);transition:border-color .2s}
.cms-thumb-wrap:hover{border-color:var(--orange-l)}
.cms-thumb-wrap img{width:100%;height:100%;object-fit:cover}
.cms-thumb-ov{position:absolute;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;font-size:11px;font-weight:700;color:#fff;flex-direction:column;gap:3px;text-align:center;padding:4px}
.cms-thumb-wrap:hover .cms-thumb-ov{opacity:1}
.cms-file-in{display:none}
.cms-fields{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.cms-row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cms-field label{display:block;font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.cms-field input,.cms-field select{width:100%;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:8px 10px;color:var(--t1);font-family:'Nunito',sans-serif;font-size:13px;font-weight:600;outline:none;transition:border-color .2s}
.cms-field input:focus,.cms-field select:focus{border-color:rgba(249,115,22,.5)}
.cms-field select option{background:var(--bg3)}
.cms-card-btns{display:flex;gap:8px;margin-top:4px}
.btn-save{background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.3);color:#86EFAC;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px;cursor:pointer;transition:all .2s}
.btn-save:hover{background:rgba(34,197,94,.22)}
.btn-del{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.25);color:#FCA5A5;font-family:'Nunito',sans-serif;font-size:12px;font-weight:700;padding:6px 14px;border-radius:100px;cursor:pointer;transition:all .2s}
.btn-del:hover{background:rgba(239,68,68,.2)}
.cms-add-btn{width:100%;padding:14px;background:none;border:2px dashed var(--border-h);border-radius:var(--rl);color:var(--t3);font-family:'Nunito',sans-serif;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px}
.cms-add-btn:hover{border-color:var(--orange-l);color:var(--orange-l)}

/* CMS DANGER */
.danger-zone{margin-top:24px;padding:16px;background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.2);border-radius:var(--r)}
.danger-title{font-size:11px;font-weight:700;color:#FCA5A5;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.danger-btn{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);color:#FCA5A5;font-family:'Nunito',sans-serif;font-size:13px;font-weight:700;padding:8px 16px;border-radius:100px;cursor:pointer;transition:all .2s;margin-right:8px;margin-top:4px;display:inline-block}
.danger-btn:hover{background:rgba(239,68,68,.2)}

/* CMS HISTORY */
.cms-hist-item{display:flex;align-items:center;gap:12px;background:var(--bg2);border:1px solid var(--border);border-radius:var(--r);padding:10px 14px;margin-bottom:8px}
.cms-hist-num{font-size:11px;color:var(--t3);font-weight:700;width:28px;flex-shrink:0;text-align:center}
.cms-hist-thumb{width:36px;height:50px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;overflow:hidden}
.cms-hist-thumb img{width:100%;height:100%;object-fit:cover;border-radius:5px}
.cms-hist-info{flex:1;min-width:0}
.cms-hist-name{font-size:13px;font-weight:700;color:var(--t1);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cms-hist-time{font-size:11px;color:var(--t3);font-weight:600;margin-top:2px}
.cms-hist-empty{text-align:center;color:var(--t3);font-size:14px;font-weight:600;padding:40px 0}

/* SETTINGS GROUPS */
.set-group{background:var(--bg2);border:1px solid var(--border);border-radius:var(--rl);padding:18px;margin-bottom:14px;display:flex;flex-direction:column;gap:10px}
.set-group-title{font-size:11px;font-weight:900;color:var(--orange-l);text-transform:uppercase;letter-spacing:.09em;padding-bottom:10px;border-bottom:1px solid var(--border);margin-bottom:2px}

/* NOTIFICATION */
.notif{position:fixed;bottom:28px;left:50%;transform:translateX(-50%) translateY(120px);background:var(--bg2);border:1px solid var(--border-h);color:var(--t1);font-size:14px;font-weight:700;padding:13px 26px;border-radius:100px;z-index:300;transition:transform .35s ease;white-space:nowrap;box-shadow:0 8px 32px rgba(0,0,0,.5)}
.notif.show{transform:translateX(-50%) translateY(0)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
@media(max-width:500px){.pull-price{font-size:17px}.prize-grid{grid-template-columns:repeat(auto-fill,minmax(118px,1fr))}.cms-panel{max-width:100%}.cms-row2{grid-template-columns:1fr}}
</style>
</head>
<body>

<div class="banner">
  <div class="banner-bg"></div>
  <div class="particles" id="particles"></div>
  <div class="banner-content">
    <div class="banner-badge" id="banner-badge">🔥 Gacha Pokémon Coneh</div>
    <h1 class="banner-title" id="banner-headline">PSA 10<br>FIESTA</h1>
    <p class="banner-sub" id="banner-sub">PSA 10 Graded Cards</p>
    <div class="banner-stats">
      <div class="stat-pill"><span class="lbl">Per Pull</span><span class="val">Rp 15.000</span></div>
      <div class="stat-pill"><span class="lbl">10× Pull</span><span class="val">Rp 135.000</span></div>
      <div class="stat-pill"><span class="lbl">Sisa Item</span><span class="val" id="banner-rem">—</span></div>
    </div>
  </div>
</div>

<div class="main">

  <div class="section-hd">
    <div class="section-title">🏆 Prize Pool</div>
    <div style="font-size:12px;color:var(--t3);font-weight:600">Odds berubah real-time</div>
  </div>
  <div class="prize-grid" id="prize-grid"></div>

  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>

<div class="cms-ov" id="cms-ov">

<div class="notif" id="notif"></div>

<script>
/* ═══════════ STORAGE KEYS ═══════════ */
const LS={prizes:'gp_prizes_v3',history:'gp_history_v3',totalOrig:'gp_total_v3',settings:'gp_settings_v3'};

/* ═══════════ DEFAULT DATA ═══════════ */
const DEFAULTS=[
  {id:1,name:'Charizard VSTAR Rainbow',tier:'PSA 10',tc:'rainbow',rem:1,total:1,emoji:'🌈',image:'',cBg:'linear-gradient(135deg,#1a0030,#0d1a40,#0d3020)',cBorder:'rgba(168,85,247,.9)'},
  {id:2,name:'Charizard ex Gold Art',tier:'PSA 10',tc:'gold',rem:2,total:2,emoji:'⭐',image:'',cBg:'linear-gradient(135deg,#1a1200,#2a1a00)',cBorder:'rgba(234,179,8,.9)'},
  {id:3,name:'Charizard ex Alt Art',tier:'SSR',tc:'purple',rem:5,total:10,emoji:'🔮',image:'',cBg:'linear-gradient(135deg,#16062a,#0d1030)',cBorder:'rgba(168,85,247,.6)'},
  {id:4,name:'Charizard V Full Art',tier:'SR',tc:'blue',rem:8,total:20,emoji:'💎',image:'',cBg:'linear-gradient(135deg,#06122a,#020e24)',cBorder:'rgba(59,130,246,.6)'},
  {id:5,name:'Charizard VMAX',tier:'R',tc:'green',rem:20,total:50,emoji:'🔥',image:'',cBg:'linear-gradient(135deg,#041a10,#061408)',cBorder:'rgba(34,197,94,.5)'},
  {id:6,name:'Charizard Holo Rare',tier:'R',tc:'green',rem:30,total:80,emoji:'✨',image:'',cBg:'linear-gradient(135deg,#041a10,#061408)',cBorder:'rgba(34,197,94,.5)'},
  {id:7,name:'Charizard Common Pack',tier:'C',tc:'gray',rem:100,total:300,emoji:'🃏',image:'',cBg:'#1A1A2E',cBorder:'rgba(255,255,255,.15)'},
];

/* ═══════════ DEFAULT SETTINGS ═══════════ */
const DEFAULT_SETTINGS={
  badge:'🔥 Gacha Pokémon Coneh',
  titleLine1:'PSA 10',
  titleLine2:'FIESTA',
  subtitle:'PSA 10 Graded Cards',
  pageTitle:'Ultimate Charizard Hunt Vol. 14 · Pokémon TCG',
  price1x:15000,
  price10x:135000,
  savingsLabel:'HEMAT 10%',
  cardBackEmoji:'🔥',
  cardBackText:'PSA 10 FIESTA',
};

/* ═══════════ TIER STYLES ═══════════ */
const TC={
  rainbow:{bg:'linear-gradient(135deg,#7C3AED,#3B82F6)',tx:'#fff',art:'rainbow-a',cBg:'linear-gradient(135deg,#1a0030,#0d1a40,#0d3020)',cBorder:'rgba(168,85,247,.9)'},
  gold:   {bg:'linear-gradient(135deg,#854d0e,#ca8a04)',tx:'#FDE047',art:'gold-a',cBg:'linear-gradient(135deg,#1a1200,#2a1a00)',cBorder:'rgba(234,179,8,.9)'},
  purple: {bg:'rgba(168,85,247,.25)',tx:'#C084FC',art:'purple-a',cBg:'linear-gradient(135deg,#16062a,#0d1030)',cBorder:'rgba(168,85,247,.6)'},
  blue:   {bg:'rgba(59,130,246,.2)',tx:'#93C5FD',art:'blue-a',cBg:'linear-gradient(135deg,#06122a,#020e24)',cBorder:'rgba(59,130,246,.6)'},
  green:  {bg:'rgba(34,197,94,.2)',tx:'#86EFAC',art:'green-a',cBg:'linear-gradient(135deg,#041a10,#061408)',cBorder:'rgba(34,197,94,.5)'},
  gray:   {bg:'rgba(255,255,255,.08)',tx:'#64748B',art:'gray-a',cBg:'#1A1A2E',cBorder:'rgba(255,255,255,.15)'},
};

/* ═══════════ STATE ═══════════ */
let prizes=load(LS.prizes,DEFAULTS);
let history=load(LS.history,[]);
let settings=loadSettings();
let totalOrig=parseInt(localStorage.getItem(LS.totalOrig))||DEFAULTS.reduce((s,p)=>s+p.total,0);
let pulledNow=[];
let cmsTab='prizes';
let nextId=prizes.reduce((m,p)=>Math.max(m,p.id),0)+1;

/* ═══════════ LOAD/SAVE ═══════════ */
function load(key,def){try{const d=JSON.parse(localStorage.getItem(key));return Array.isArray(d)&&d.length?d:JSON.parse(JSON.stringify(def));}catch(e){return JSON.parse(JSON.stringify(def));}}
function loadSettings(){try{const d=JSON.parse(localStorage.getItem(LS.settings));return d&&typeof d==='object'?{...DEFAULT_SETTINGS,...d}:{...DEFAULT_SETTINGS};}catch(e){return{...DEFAULT_SETTINGS};}}
function savePrizes(){try{localStorage.setItem(LS.prizes,JSON.stringify(prizes));}catch(e){showNotif('⚠️ Storage penuh! Hapus beberapa gambar.');}}
function saveHistory(){try{localStorage.setItem(LS.history,JSON.stringify(history));}catch(e){}}
function saveTotalOrig(){localStorage.setItem(LS.totalOrig,totalOrig);}
function saveSettings(){try{localStorage.setItem(LS.settings,JSON.stringify(settings));}catch(e){}}

/* ═══════════ HELPERS ═══════════ */
const getTotal=()=>prizes.reduce((s,p)=>s+p.rem,0);
const getOdds=p=>{const t=getTotal();return t?((p.rem/t)*100).toFixed(2):'0.00';};
const fmtIDR=n=>n.toLocaleString('id-ID');
const tcOf=tc=>TC[tc]||TC.gray;
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
function fmtTime(ts){const d=new Date(ts),now=new Date(),diff=Math.floor((now-d)/1000);if(diff<60)return 'baru saja';if(diff<3600)return Math.floor(diff/60)+'m lalu';if(diff<86400)return Math.floor(diff/3600)+'j lalu';return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'});}

/* ═══════════ RENDER PRIZES ═══════════ */
function renderPrizes(){
  const g=document.getElementById('prize-grid');
  if(!prizes.length){g.innerHTML='<div style="grid-column:1/-1;text-align:center;color:var(--t3);padding:28px;font-size:14px;font-weight:600">Belum ada prize. Tambah lewat CMS!</div>';return;}
  g.innerHTML=prizes.map(p=>{
    const t=tcOf(p.tc);
    const sc=p.rem<=1?'st-low':p.rem<=5?'st-mid':'st-ok';
    const artContent=p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:`${p.emoji}`;
    return `<div class="pcard ${p.tc}${p.rem===0?' sold-out':''}">
      ${p.rem===0?'<div class="sold-out-badge">Habis</div>':''}
      <div class="card-inner">
        <div class="card-art ${p.image?'':t.art}">
          <div class="tier-badge" style="background:${t.bg};color:${t.tx}">${esc(p.tier)}</div>
          ${artContent}
        </div>
        <div class="prize-name">${esc(p.name)}</div>
        <div class="prize-odds">${getOdds(p)}% peluang</div>
        <div class="prize-stock ${sc}">Sisa ${p.rem}</div>
      </div>
    </div>`;
  }).join('');
}

/* ═══════════ RENDER ODDS ═══════════ */
function renderOdds(){
  document.getElementById('odds-tbody').innerHTML=prizes.map(p=>{
    const t=tcOf(p.tc);
    const col=p.tc==='rainbow'?'#A855F7':p.tc==='gold'?'#EAB308':'#CBD5E1';
    const thumb=p.image?`<img src="${p.image}" style="width:20px;height:28px;border-radius:3px;object-fit:cover;vertical-align:middle;margin-right:5px">`:p.emoji+' ';
    return `<tr><td>${thumb}${esc(p.name)}</td>
      <td><span style="background:${t.bg};color:${t.tx};padding:2px 8px;border-radius:100px;font-size:11px;font-weight:700">${esc(p.tier)}</span></td>
      <td>${p.rem} / ${p.total}</td>
      <td style="font-weight:700;color:${col}">${getOdds(p)}%</td></tr>`;
  }).join('');
}

/* ═══════════ RENDER HISTORY ═══════════ */
function renderHistory(){
  const el=document.getElementById('history-list');
  if(!history.length){el.innerHTML='<div class="history-empty">Belum ada pull. Coba tarik kartu pertamamu! 🎴</div>';return;}
  el.innerHTML=history.slice().reverse().map((h,i)=>{
    const t=tcOf(h.tc);
    const thumb=h.image?`<div class="h-thumb"><img src="${h.image}" alt="${esc(h.name)}"></div>`:`<div class="h-thumb" style="background:${t.bg};border-radius:6px">${h.emoji}</div>`;
    return `<div class="history-item">
      ${thumb}
      <div class="h-info">
        <div class="h-name">${esc(h.name)}</div>
        <span class="h-tier" style="background:${t.bg};color:${t.tx}">${esc(h.tier)}</span>
        <div class="h-pullnum">Pull #${history.length-i}</div>
      </div>
      <div class="h-time">${fmtTime(h.ts)}</div>
    </div>`;
  }).join('');
}

/* ═══════════ PULL LOGIC ═══════════ */
function pickPrize(){
  const avail=prizes.filter(p=>p.rem>0);
  if(!avail.length)return null;
  const total=avail.reduce((s,p)=>s+p.rem,0);
  let r=Math.floor(Math.random()*total);
  for(const p of avail){r-=p.rem;if(r<0)return p;}
  return avail[avail.length-1];
}

function doPull(count){
  const rem=getTotal();
  if(rem===0){showNotif('❌ Semua hadiah sudah habis!');return;}
  const actual=Math.min(count,rem);
  const pulled=[];
  for(let i=0;i<actual;i++){const p=pickPrize();if(p){p.rem--;pulled.push({...p});}}
  pulled.forEach(p=>history.push({id:p.id,name:p.name,tier:p.tier,tc:p.tc,emoji:p.emoji,image:p.image||'',ts:Date.now()}));
  saveHistory();
  savePrizes();
  pulledNow=pulled;
  updateUI();
  showModal(pulled);
}

/* ═══════════ MODAL ═══════════ */
function showModal(pulled){
  document.getElementById('reveal-title').textContent=pulled.length===1?'Tap kartu untuk membuka! 🔥':`${pulled.length} hadiah menunggumu! ✨`;
  document.getElementById('cards-grid').innerHTML=pulled.map((p,i)=>{
    const t=tcOf(p.tc);
    const front=p.image?`<img class="cfront-img" src="${p.image}" alt="${esc(p.name)}">`:`<div class="cfront-emoji">${p.emoji}</div>`;
    return `<div class="rcard" onclick="flipCard(${i})" id="rc${i}">
      <div class="rcard-inner" id="rci${i}">
        <div class="cface cback"><span class="cback-emoji">${settings.cardBackEmoji}</span><span class="cback-logo">${esc(settings.cardBackText)}</span></div>
        <div class="cface cfront" style="background:${p.cBg||t.cBg};border:2px solid ${p.cBorder||t.cBorder}">
          ${front}<div class="cfront-name">${esc(p.name)}</div>
          <div class="cfront-tier" style="background:${t.bg};color:${t.tx}">${esc(p.tier)}</div>
        </div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('modal').classList.add('active');
  if(pulled.length===1)setTimeout(()=>flipCard(0),550);
}

function flipCard(i){
  const el=document.getElementById('rci'+i);
  if(el)el.classList.add('flipped');
  setTimeout(()=>{
    if(pulledNow.every((_,j)=>{const e=document.getElementById('rci'+j);return e&&e.classList.contains('flipped');}))
      document.getElementById('reveal-title').textContent='🎉 Selamat! Hadiahmu sudah siap dikirim!';
  },700);
}

function revealAll(){pulledNow.forEach((_,i)=>setTimeout(()=>flipCard(i),i*180));}
function closeModal(){document.getElementById('modal').classList.remove('active');}

/* ═══════════ UI HELPERS ═══════════ */
function toggleOdds(){document.getElementById('odds-wrap').classList.toggle('open');document.getElementById('odds-chev').classList.toggle('open');}
function clearHistory(){if(!history.length)return;if(!confirm('Hapus semua riwayat pull?'))return;history=[];saveHistory();renderHistory();showNotif('🗑 Riwayat dihapus.');}

/* ═══════════ APPLY SETTINGS TO DOM ═══════════ */
function applySettings(){
  const s=settings;
  const badge=document.getElementById('banner-badge');
  if(badge) badge.textContent=s.badge;
  const hl=document.getElementById('banner-headline');
  if(hl) hl.innerHTML=esc(s.titleLine1)+'<br>'+esc(s.titleLine2);
  const sub=document.getElementById('banner-sub');
  if(sub) sub.textContent=s.subtitle;
  document.title=s.pageTitle;
  const p1=document.getElementById('price-1x');
  if(p1) p1.textContent='Rp '+fmtIDR(s.price1x);
  const p10=document.getElementById('price-10x');
  if(p10) p10.textContent='Rp '+fmtIDR(s.price10x);
  const sav=document.getElementById('savings-badge');
  if(sav) sav.textContent=s.savingsLabel;
}

function updateUI(){
  const rem=getTotal();
  const pct=totalOrig>0?(rem/totalOrig*100):0;
  document.getElementById('rem-count').textContent=rem;
  document.getElementById('total-count').textContent=totalOrig;
  document.getElementById('banner-rem').textContent=rem;
  document.getElementById('stock-fill').style.width=Math.min(100,pct).toFixed(1)+'%';
  document.getElementById('btn1').disabled=rem===0;
  document.getElementById('btn10').disabled=rem===0;
  applySettings();
  renderPrizes();renderOdds();renderHistory();
}

function showNotif(msg){
  const el=document.getElementById('notif');
  el.textContent=msg;el.classList.add('show');
  clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),3200);
}

/* ═══════════ CMS ═══════════ */
function openCMS(){document.getElementById('cms-ov').classList.add('active');renderCMSTab();}
function closeCMS(){document.getElementById('cms-ov').classList.remove('active');}

function switchTab(tab,btn){
  cmsTab=tab;
  document.querySelectorAll('.cms-tab').forEach(t=>t.classList.remove('active'));
  btn.classList.add('active');
  renderCMSTab();
}

function renderCMSTab(){
  if(cmsTab==='prizes')renderCMSPrizes();
  else if(cmsTab==='history')renderCMSHistory();
  else renderCMSSettings();
}

/* ═══════════ CMS PRIZES ═══════════ */
function renderCMSPrizes(){
  const body=document.getElementById('cms-body');
  const tcOpts=['rainbow','gold','purple','blue','green','gray'].map(t=>`<option value="${t}">${t[0].toUpperCase()+t.slice(1)}</option>`).join('');

  body.innerHTML=prizes.map(p=>{
    const thumbInner=p.image?`<img src="${p.image}" alt="${esc(p.name)}">`:`<span>${p.emoji}</span>`;
    return `<div class="cms-prize-card" id="cpc-${p.id}">
      <div class="cms-thumb-wrap" onclick="triggerUpload(${p.id})" title="Klik untuk upload gambar">
        ${thumbInner}
        <div class="cms-thumb-ov">📷<br><small>Upload<br>Gambar</small></div>
        <input class="cms-file-in" type="file" accept="image/*" id="fi-${p.id}" onchange="handleUpload(${p.id},this)">
      </div>
      <div class="cms-fields">
        <div class="cms-field"><label>Nama Prize</label><input type="text" id="fn-${p.id}" value="${esc(p.name)}" placeholder="Nama hadiah"></div>
        <div class="cms-row2">
          <div class="cms-field"><label>Label Tier</label><input type="text" id="ft-${p.id}" value="${esc(p.tier)}" placeholder="PSA 10, SSR..."></div>
          <div class="cms-field"><label>Warna Tier</label><select id="fc-${p.id}">${tcOpts.replace(`value="${p.tc}"`,`value="${p.tc}" selected`)}</select></div>
        </div>
        <div class="cms-row2">
          <div class="cms-field"><label>Stok Sisa</label><input type="number" id="fr-${p.id}" value="${p.rem}" min="0"></div>
          <div class="cms-field"><label>Total Stok</label><input type="number" id="fo-${p.id}" value="${p.total}" min="1"></div>
        </div>
        <div class="cms-field"><label>Emoji (fallback)</label><input type="text" id="fe-${p.id}" value="${esc(p.emoji)}" placeholder="🎴"></div>
        <div class="cms-card-btns">
          <button class="btn-save" onclick="savePrize(${p.id})">✓ Simpan</button>
          <button class="btn-del" onclick="deletePrize(${p.id})">✕ Hapus</button>
          ${p.image?`<button class="btn-del" onclick="clearImg(${p.id})" style="font-size:11px">🗑 Hapus Foto</button>`:''}
        </div>
      </div>
    </div>`;
  }).join('');

  body.innerHTML+=`<button class="cms-add-btn" onclick="addPrize()">+ Tambah Prize Baru</button>`;
  body.innerHTML+=`<div class="danger-zone"><div class="danger-title">⚠ Zona Berbahaya</div>
    <button class="danger-btn" onclick="resetToDefault()">Reset Prize ke Default</button></div>`;
}

function triggerUpload(id){document.getElementById('fi-'+id).click();}

function handleUpload(id,input){
  if(!input.files||!input.files[0])return;
  const file=input.files[0];
  // Warn if file is large
  if(file.size>500000)showNotif('⚠️ File besar, mungkin gagal tersimpan. Gunakan gambar < 500KB.');
  const reader=new FileReader();
  reader.onload=e=>{
    const p=prizes.find(x=>x.id===id);
    if(!p)return;
    p.image=e.target.result;
    try{savePrizes();}catch(ex){p.image='';showNotif('❌ Gambar terlalu besar untuk disimpan.');return;}
    renderCMSPrizes();updateUI();
    showNotif('🖼 Gambar berhasil diupload!');
  };
  reader.readAsDataURL(file);
}

function clearImg(id){
  const p=prizes.find(x=>x.id===id);
  if(p){p.image='';savePrizes();renderCMSPrizes();updateUI();showNotif('🗑 Foto dihapus.');}
}

function savePrize(id){
  const p=prizes.find(x=>x.id===id);
  if(!p)return;
  const name=document.getElementById('fn-'+id).value.trim();
  if(!name){showNotif('⚠️ Nama prize tidak boleh kosong!');return;}
  const tc=document.getElementById('fc-'+id).value;
  const t=tcOf(tc);
  Object.assign(p,{
    name,
    tier:document.getElementById('ft-'+id).value.trim()||p.tier,
    tc,
    rem:Math.max(0,parseInt(document.getElementById('fr-'+id).value)||0),
    total:Math.max(1,parseInt(document.getElementById('fo-'+id).value)||1),
    emoji:document.getElementById('fe-'+id).value.trim()||'🎴',
    cBg:t.cBg,cBorder:t.cBorder,
  });
  totalOrig=prizes.reduce((s,x)=>s+x.total,0);
  saveTotalOrig();savePrizes();updateUI();
  showNotif(`✅ "${name}" disimpan!`);
}

function deletePrize(id){
  if(!confirm('Hapus prize ini?'))return;
  prizes=prizes.filter(p=>p.id!==id);
  totalOrig=prizes.reduce((s,p)=>s+p.total,0)||1;
  saveTotalOrig();savePrizes();renderCMSPrizes();updateUI();
  showNotif('🗑 Prize dihapus.');
}

function addPrize(){
  const t=tcOf('green');
  const p={id:nextId++,name:'Prize Baru',tier:'R',tc:'green',rem:10,total:10,emoji:'🎁',image:'',cBg:t.cBg,cBorder:t.cBorder};
  prizes.push(p);
  totalOrig=prizes.reduce((s,x)=>s+x.total,0);
  saveTotalOrig();savePrizes();renderCMSPrizes();updateUI();
  setTimeout(()=>{const el=document.getElementById('cpc-'+p.id);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});},100);
  showNotif('➕ Prize baru ditambahkan! Jangan lupa klik Simpan.');
}

function resetToDefault(){
  if(!confirm('Reset semua prize ke data default? Gambar yang diupload akan hilang.'))return;
  prizes=JSON.parse(JSON.stringify(DEFAULTS));
  nextId=prizes.reduce((m,p)=>Math.max(m,p.id),0)+1;
  totalOrig=prizes.reduce((s,p)=>s+p.total,0);
  saveTotalOrig();savePrizes();renderCMSPrizes();updateUI();
  showNotif('🔄 Prize direset ke default!');
}

/* ═══════════ CMS HISTORY ═══════════ */
function renderCMSHistory(){
  const body=document.getElementById('cms-body');
  if(!history.length){body.innerHTML='<div class="cms-hist-empty">Belum ada riwayat pull.</div>';return;}
  body.innerHTML=history.slice().reverse().map((h,i)=>{
    const t=tcOf(h.tc);
    const thumb=h.image
      ?`<div class="cms-hist-thumb"><img src="${h.image}" alt="${esc(h.name)}"></div>`
      :`<div class="cms-hist-thumb" style="background:${t.bg};border-radius:5px">${h.emoji}</div>`;
    return `<div class="cms-hist-item">
      <div class="cms-hist-num">#${history.length-i}</div>
      ${thumb}
      <div class="cms-hist-info">
        <div class="cms-hist-name">${esc(h.name)}</div>
        <span style="background:${t.bg};color:${t.tx};padding:1px 7px;border-radius:100px;font-size:10px;font-weight:700">${esc(h.tier)}</span>
        <div class="cms-hist-time">${fmtTime(h.ts)}</div>
      </div>
    </div>`;
  }).join('');
  body.innerHTML+=`<div class="danger-zone"><div class="danger-title">⚠ Zona Berbahaya</div>
    <button class="danger-btn" onclick="clearHistory();renderCMSHistory()">Hapus Semua Riwayat</button></div>`;
}

/* ═══════════ CMS SETTINGS ═══════════ */
function renderCMSSettings(){
  const s=settings;
  const body=document.getElementById('cms-body');
  body.innerHTML=`
  <div class="set-group">
    <div class="set-group-title">🎨 Banner &amp; Teks Halaman</div>
    <div class="cms-field"><label>Badge (teks kecil di atas judul)</label><input type="text" id="s-badge" value="${esc(s.badge)}" placeholder="🔥 Pokémon TCG · Vol. 14"></div>
    <div class="cms-row2">
      <div class="cms-field"><label>Judul Baris 1</label><input type="text" id="s-t1" value="${esc(s.titleLine1)}" placeholder="Ultimate"></div>
      <div class="cms-field"><label>Judul Baris 2</label><input type="text" id="s-t2" value="${esc(s.titleLine2)}" placeholder="Charizard Hunt"></div>
    </div>
    <div class="cms-field"><label>Subjudul (di bawah judul)</label><input type="text" id="s-sub" value="${esc(s.subtitle)}" placeholder="Hadiah fisik · Termasuk PSA 10..."></div>
    <div class="cms-field"><label>Judul Tab Browser</label><input type="text" id="s-page" value="${esc(s.pageTitle)}" placeholder="Gacha Page · My Store"></div>
  </div>

  <div class="set-group">
    <div class="set-group-title">💰 Harga</div>
    <div class="cms-row2">
      <div class="cms-field"><label>Harga 1× Pull (Rp)</label><input type="number" id="s-p1" value="${s.price1x}" min="0" step="1000"></div>
      <div class="cms-field"><label>Harga 10× Pull (Rp)</label><input type="number" id="s-p10" value="${s.price10x}" min="0" step="1000"></div>
    </div>
    <div class="cms-field"><label>Label Diskon 10× (badge)</label><input type="text" id="s-sav" value="${esc(s.savingsLabel)}" placeholder="HEMAT 10%"></div>
  </div>

  <div class="set-group">
    <div class="set-group-title">🃏 Kartu Gacha (sisi belakang)</div>
    <div class="cms-row2">
      <div class="cms-field"><label>Emoji Kartu Belakang</label><input type="text" id="s-ce" value="${esc(s.cardBackEmoji)}" placeholder="🔥"></div>
      <div class="cms-field"><label>Teks Kartu Belakang</label><input type="text" id="s-ct" value="${esc(s.cardBackText)}" placeholder="CHARIZARD HUNT"></div>
    </div>
  </div>

  <div style="display:flex;gap:10px;margin-top:4px">
    <button class="btn-save" style="flex:1;padding:12px;font-size:14px" onclick="applyAndSaveSettings()">✓ Simpan &amp; Terapkan Semua</button>
  </div>

  <div class="danger-zone" style="margin-top:20px">
    <div class="danger-title">⚠ Zona Berbahaya</div>
    <button class="danger-btn" onclick="resetSettings()">Reset Konten ke Default</button>
  </div>`;
}

function applyAndSaveSettings(){
  const get=id=>document.getElementById(id);
  settings.badge        = get('s-badge').value.trim() || DEFAULT_SETTINGS.badge;
  settings.titleLine1   = get('s-t1').value.trim()   || DEFAULT_SETTINGS.titleLine1;
  settings.titleLine2   = get('s-t2').value.trim()   || DEFAULT_SETTINGS.titleLine2;
  settings.subtitle     = get('s-sub').value.trim()  || DEFAULT_SETTINGS.subtitle;
  settings.pageTitle    = get('s-page').value.trim() || DEFAULT_SETTINGS.pageTitle;
  settings.price1x      = Math.max(0,parseInt(get('s-p1').value)||DEFAULT_SETTINGS.price1x);
  settings.price10x     = Math.max(0,parseInt(get('s-p10').value)||DEFAULT_SETTINGS.price10x);
  settings.savingsLabel = get('s-sav').value.trim()  || DEFAULT_SETTINGS.savingsLabel;
  settings.cardBackEmoji= get('s-ce').value.trim()   || DEFAULT_SETTINGS.cardBackEmoji;
  settings.cardBackText = get('s-ct').value.trim()   || DEFAULT_SETTINGS.cardBackText;
  saveSettings();
  updateUI();
  showNotif('✅ Konten & harga berhasil disimpan!');
}

function resetSettings(){
  if(!confirm('Reset semua konten & harga ke default?'))return;
  settings={...DEFAULT_SETTINGS};
  saveSettings();
  renderCMSSettings();
  updateUI();
  showNotif('🔄 Konten direset ke default!');
}

/* ═══════════ FIRE PARTICLES ═══════════ */
(function(){
  const c=document.getElementById('particles');
  const cols=['#F97316','#FB923C','#FCD34D','#EF4444','#FBBF24'];
  for(let i=0;i<22;i++){
    const p=document.createElement('div');p.className='particle';
    const s=Math.random()*9+3;
    p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${cols[i%cols.length]};animation-duration:${(Math.random()*3+2).toFixed(1)}s;animation-delay:${(Math.random()*4).toFixed(1)}s`;
    c.appendChild(p);
  }
})();

/* ═══════════ INIT ═══════════ */
updateUI();
</script>
